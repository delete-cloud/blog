# OINK Starter — the only site configuration file.
# Change the two marked values first; everything else builds as-is.

title: &siteTitle Kina's Blog
baseURL: https://blog.kinaz.me/
defaultContentLanguage: zh
disableLanguages: [fr]
defaultContentLanguageInSubdir: false
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 2
    title: *siteTitle
    params:
      description: Documentation, updates, and guides for your project.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 你的项目文档、动态与指南。
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle
    params:
      description: Documentation, actualités et guides de votre projet.

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    # theme_color: '#245f94'
    # typography: system
    # image_zoom: true
    # share: [mastodon, linkedin, email, copy]
    # feedback:
    #   enable: true
    #   reasons: true

  github_repo: https://github.com/delete-cloud/blog
  github_branch: main

  logo: images/avatar.png

  comments:
    enable: true
    type: giscus
    giscus:
      repo: delete-cloud/blog
      repoId: R_kgDOVSd2Vw
      category: Announcements
      categoryId: DIC_kwDOVSd2V84DJRK2
      mapping: pathname
      inputPosition: bottom
      theme: auto
      loading: lazy

  # Optional layout choice. Theme defaults remain active while commented.
  # page_width: wide

# Optional Google Analytics. Production builds only; previews stay untracked.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

module:
  proxy: https://goproxy.cn
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.166.0
