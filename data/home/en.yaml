sections: [hero]

hero:
  align: start
  title_size: 3.6rem
  image:
    src: /images/avatar.png
    alt: Kina's avatar
  media:
    max_width: 180px
  eyebrow: Deep Diving
  title_lines:
    - words: [{ text: "Kina's Blog" }]
  lead: |
    <span class="td-landing-hero__social"><a style="margin:0 0.45em" href="https://github.com/delete-cloud" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a><a style="margin:0 0.45em" href="https://t.me/kina0630" target="_blank" rel="noopener noreferrer" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a><a style="margin:0 0.45em" href="mailto:i@kinaz.me" aria-label="Email"><i class="fa-solid fa-envelope"></i></a><a style="margin:0 0.45em" href="https://x.com/kina0630111171" target="_blank" rel="noopener noreferrer" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a></span>
  actions:
    - { label: Read the blog, url: blog/, icon: fa-solid fa-blog, style: primary }
    - { label: RSS feed, url: blog/index.xml, icon: fa-solid fa-rss, style: ghost }
